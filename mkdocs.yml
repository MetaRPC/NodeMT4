site_name: NodeMT4 SDK Documentation
site_url: https://metarpc.github.io/NodeMT4/
site_description: Complete Node.js SDK for MetaTrader 4 trading automation via gRPC

repo_name: MetaRPC/NodeMT4
repo_url: https://github.com/MetaRPC/NodeMT4
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/language-javascript
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
  custom_dir: docs/includes

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MetaRPC/NodeMT4
      name: NodeMT4 on GitHub

extra_css:
  - styles/custom.css

extra_javascript:
  - javascripts/ux.js

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: "¶"
      toc_depth: 3

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        # ── source language ──────────────────────────────────────────────
        - locale: en
          default: true
          name: English
          build: true
        # ── Phase 1 · core Asian markets ─────────────────────────────────
        - { locale: zh,      name: 简体中文,            build: true }
        - { locale: ja,      name: 日本語,              build: true }
        - { locale: ko,      name: 한국어,              build: true }
        - { locale: vi,      name: Tiếng Việt,         build: true }
        - { locale: th,      name: ไทย,                build: true }
        - { locale: id,      name: Bahasa Indonesia,   build: true }
        # ── Phase 2 · rest of Asia (RTL where noted) ─────────────────────
        - { locale: zh-TW,   name: 繁體中文,            build: true }
        - { locale: hi,      name: हिन्दी,               build: true }
        - { locale: ar,      name: العربية,            build: true }
        - { locale: ms,      name: Bahasa Melayu,      build: true }
        - { locale: tl,      name: Filipino,           build: true }
        - { locale: tr,      name: Türkçe,             build: true }
        - { locale: fa,      name: فارسی,              build: true }
        - { locale: ur,      name: اردو,               build: true }
        - { locale: bn,      name: বাংলা,               build: true }
        - { locale: ta,      name: தமிழ்,               build: true }
        - { locale: my,      name: မြန်မာ,              build: true }
        - { locale: km,      name: ខ្មែរ,                build: true }
        - { locale: lo,      name: ລາວ,                build: true }
        - { locale: he,      name: עברית,              build: true }
        # ── Phase 3 · major non-Asian markets ────────────────────────────
        - { locale: es,      name: Español,            build: true }
        - { locale: pt-BR,   name: Português (Brasil), build: true }
        - { locale: ru,      name: Русский,            build: true }
        - { locale: fr,      name: Français,           build: true }
        - { locale: de,      name: Deutsch,            build: true }
        - { locale: it,      name: Italiano,           build: true }
        - { locale: pl,      name: Polski,             build: true }

copyright: >
  Copyright © 2024–2025 MetaRPC. MT4 is a trademark of MetaQuotes Software Corp.
  This documentation is community-maintained and not affiliated with MetaQuotes.

nav:
  - Home: index.md

  - Guides:
    - "GETTING STARTED": "All_Guides/GETTING_STARTED.md"
    - "MT4 For Beginners": "All_Guides/MT4_For_Beginners.md"
    - "Your First Project": "All_Guides/Your_First_Project.md"
    - "PROJECT MAP": "All_Guides/PROJECT_MAP.md"
    - "SDK ECOSYSTEM (+ Trade Copier)": "All_Guides/SDK_Ecosystem.md"
    - "GLOSSARY": "All_Guides/GLOSSARY.md"
    - "CONCURRENCY MODEL": "All_Guides/CONCURRENCY_MODEL.md"
    - "GRPC STREAM MANAGEMENT": "All_Guides/GRPC_STREAM_MANAGEMENT.md"
    - "ENUMS USAGE REFERENCE": "All_Guides/ENUMS_USAGE_REFERENCE.md"
    - "RETURN CODES REFERENCE": "All_Guides/RETURN_CODES_REFERENCE.md"
    - "PROTOBUF INSPECTOR GUIDE": "All_Guides/PROTOBUF_INSPECTOR_GUIDE.md"
    - "USERCODE SANDBOX GUIDE": "All_Guides/USERCODE_SANDBOX_GUIDE.md"

  - Orchestrators:
    - "Strategies Master Overview": "Orchestrators/Strategies.Master.Overview.md"
    - "11 Trailing stop": "Orchestrators/11_Trailing_stop.md"
    - "12 Grid trader": "Orchestrators/12_Grid_trader.md"
